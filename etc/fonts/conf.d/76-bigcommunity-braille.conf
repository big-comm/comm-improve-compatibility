<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Braille for the fastfetch owl. Noto Mono Nerd Font, Ashyterm's default,
  has no braille, and DejaVu Sans (75-bigcommunity-braille-dejavu.conf)
  draws it as small, spaced dots. BigCommunity Braille has only the 256
  braille patterns, with large dots that fill the cell (generated by
  bigcommunity-fastfetch/tools/make-braille-font.py). DejaVu Sans stops
  claiming braille, and wherever it is a fallback, BigCommunity Braille
  comes right after it; text is unchanged.
-->
<fontconfig>
  <match target="scan">
    <test name="family">
      <string>DejaVu Sans</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset><range><int>0x2800</int><int>0x28ff</int></range></charset>
      </minus>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>DejaVu Sans</string>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>BigCommunity Braille</string>
    </edit>
  </match>
</fontconfig>
